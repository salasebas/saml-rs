[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 is required by bergshamra-keys 0.11.2 for RSA key parsing and encoding; RSA private-key operations run in kryptering on patched rsa 0.10, and saml-rs still gates software RSA key-transport decryption by default." },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    # Required by aws-lc-fips-sys when the FIPS provider is selected.
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
