name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # zizmor: ignore[ref-version-mismatch]
      - run: cargo clippy --workspace --all-targets -- -D warnings

  feature-check:
    name: Feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # zizmor: ignore[ref-version-mismatch]
      - run: cargo check -p saml-rs --no-default-features
      - run: cargo test -p saml-rs --no-default-features --test no_default_features
      - run: cargo test -p saml-rs --doc --no-default-features
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p saml-rs --lib --no-deps --no-default-features

  provider-matrix:
    name: Crypto provider (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: rustcrypto
            features: crypto-rustcrypto,crypto-legacy-algorithms,crypto-post-quantum,crypto-pkcs11
          - provider: aws-lc
            features: crypto-aws-lc
          - provider: fips
            features: crypto-fips
    env:
      CRYPTO_PROVIDER_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy
      - name: Install AWS-LC native build dependencies
        if: matrix.provider != 'rustcrypto'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang libclang-dev perl pkg-config
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.provider == 'fips'
        with:
          go-version: stable
      # Keep the workspace's existing immutable v2 cache pin.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # zizmor: ignore[ref-version-mismatch]
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - run: cargo check --workspace --locked --no-default-features --features "$CRYPTO_PROVIDER_FEATURES"
      - run: cargo clippy --workspace --locked --all-targets --no-default-features --features "$CRYPTO_PROVIDER_FEATURES" -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p saml-rs --lib --no-deps --no-default-features --features "$CRYPTO_PROVIDER_FEATURES"
      - name: Run provider security regressions
        run: >-
          cargo nextest run -p saml-rs --locked
          --no-default-features --features "$CRYPTO_PROVIDER_FEATURES"
          --test provider_regression
          --test index_conformance
          --test typed_sso
          --test xsw
          --test metadata_signature
          --test metadata_trust
          --test external_slo_redirect
      - name: Run provider error propagation regression
        run: >-
          cargo nextest run -p saml-rs --locked
          --no-default-features --features "$CRYPTO_PROVIDER_FEATURES"
          --lib detached_verification_preserves_provider_error unloadable_peer

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # zizmor: ignore[ref-version-mismatch]
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - run: cargo nextest run -p saml-rs --locked
      - run: cargo test -p saml-rs --doc --locked

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # zizmor: ignore[ref-version-mismatch]
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: saml-rs
          # Provider features are mutually exclusive. The default feature set
          # exposes the provider-neutral public API used for semver checks.
          feature-group: default-features
          # saml-rs is still pre-1.0; intentional breaking API changes are
          # released as 0.x minor bumps. release-plz decides the actual bump
          # from Conventional Commits.
          release-type: major

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # Abort the whole matrix as soon as one package fails.
      fail-fast: true
      matrix:
        package:
          - saml-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # zizmor: ignore[ref-version-mismatch]
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - run: cargo nextest run -p ${{ matrix.package }}
      - run: cargo test -p ${{ matrix.package }} --doc
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p ${{ matrix.package }} --lib --no-deps
      - run: cargo check -p ${{ matrix.package }} --examples
      - run: cargo run -p ${{ matrix.package }} --example sso
      - run: cargo run -p ${{ matrix.package }} --example slo

  compatibility:
    name: Compatibility ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # Abort the whole matrix as soon as one package fails.
      fail-fast: true
      matrix:
        package:
          - opensaml
          - samlify
          - samlet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # zizmor: ignore[ref-version-mismatch]
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - run: cargo nextest run -p ${{ matrix.package }}
      - run: cargo test -p ${{ matrix.package }} --doc
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p ${{ matrix.package }} --lib --no-deps
      - run: cargo check -p ${{ matrix.package }} --all-targets --no-default-features
      - run: cargo nextest run -p ${{ matrix.package }} --no-default-features
      - run: cargo test -p ${{ matrix.package }} --doc --no-default-features

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - feature-check
      - provider-matrix
      - msrv
      - semver
      - test
      - compatibility
    if: always()
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
