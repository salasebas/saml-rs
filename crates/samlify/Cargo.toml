[package]
name = "samlify"
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/salasebas/saml-rs"
homepage = "https://github.com/salasebas/saml-rs"
readme = "README.md"
description = "Maintained compatibility re-export of saml-rs."
keywords = ["saml", "sso", "xml", "authentication"]
categories = ["authentication", "web-programming"]
include = [
    "/Cargo.toml",
    "/src/**",
    "/tests/**",
    "/README.md",
]

[package.metadata.docs.rs]
no-default-features = true
features = ["crypto-bergshamra"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "samlify"
path = "src/lib.rs"

[features]
default = ["crypto-bergshamra"]
crypto-bergshamra = ["saml-rs/crypto-bergshamra"]
crypto-rustcrypto = ["saml-rs/crypto-rustcrypto"]
crypto-aws-lc = ["saml-rs/crypto-aws-lc"]
crypto-fips = ["saml-rs/crypto-fips"]
crypto-legacy-algorithms = ["saml-rs/crypto-legacy-algorithms"]
crypto-post-quantum = ["saml-rs/crypto-post-quantum"]
crypto-pkcs11 = ["saml-rs/crypto-pkcs11"]

[dependencies]
saml-rs = { path = "../..", version = "0.7.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
empty_docs = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
